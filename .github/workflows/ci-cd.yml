name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Os segredos VITE_* ficam em cada job que faz o build de produção, e não no
# workflow inteiro: o job e2e não pode recebê-los, porque variável de ambiente
# vence o .env.e2e e levaria a configuração real para o build de testes.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
      VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
      VITE_MESSAGING_SENDER: ${{ secrets.VITE_MESSAGING_SENDER }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
      VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
      VITE_MODE: ${{ secrets.VITE_MODE }}
      VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
      VITE_PIN_SECRET_KEY: ${{ secrets.VITE_PIN_SECRET_KEY }}
      VITE_EMAIL_WORKER_URL: ${{ secrets.VITE_EMAIL_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build

      # O build de produção não pode carregar nada do build de testes E2E
      # (emulador, atalho de login). Ver scripts/checkProductionBuild.mjs.
      - run: npm run check:build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Testes (com emulador do Firebase)
        run: npx firebase emulators:exec --project plataformacodefolio "npm run test -- --run"

  # Testes de ponta a ponta (ver plano_testes_e2e.md): o Playwright abre o
  # build de e2e num Chromium, com banco e login no emulador. Sem nenhum
  # segredo, de propósito, então roda também em PR vindo de fork.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (build e2e + emuladores + Playwright)
        run: npm run test:e2e

      # O relatório traz trace, screenshot e vídeo de cada tentativa que falhou
      # (abrir o trace com `npx playwright show-trace <arquivo>`). Sobe sempre,
      # e não só quando o job falha: um teste que falha e passa na segunda
      # tentativa (flaky) deixa o job verde, e é esse trace que mostra o porquê.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
      VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
      VITE_MESSAGING_SENDER: ${{ secrets.VITE_MESSAGING_SENDER }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
      VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
      VITE_MODE: ${{ secrets.VITE_MODE }}
      VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
      VITE_PIN_SECRET_KEY: ${{ secrets.VITE_PIN_SECRET_KEY }}
      VITE_EMAIL_WORKER_URL: ${{ secrets.VITE_EMAIL_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check:build

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy no Firebase (hosting + database rules)
        run: npx firebase deploy --only hosting,database --project plataformacodefolio

  # Worker de e-mail (emailWorker/): fila do Brevo e cron das publicações
  # programadas, na Cloudflare. Sobe a cada merge, como o app. Não dá para
  # filtrar só por mudanças em emailWorker/, porque ele embute src/shared/;
  # publicar o mesmo código só cria uma versão igual, sem efeito. Os segredos
  # do Worker (BREVO_API_KEY, FIREBASE_SERVICE_ACCOUNT) moram na Cloudflare e o
  # deploy não mexe neles; aqui só entra o token de API, com permissão de
  # Workers Scripts, KV e Queues (o mesmo que o emailWorker/setup-wizard.sh pede).
  deploy-worker:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emailWorker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EMAIL_WORKER_URL: ${{ secrets.VITE_EMAIL_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: emailWorker/package-lock.json

      - name: Conferir o token da Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - run: npm ci

      - name: Deploy do Worker na Cloudflare
        run: npx wrangler deploy

      # Fumaça: o Worker no ar responde. Sem token, /quota-status devolve 401;
      # qualquer outra coisa (404 de rota, 5xx, timeout) é deploy quebrado.
      - name: Worker respondendo
        if: env.EMAIL_WORKER_URL != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${EMAIL_WORKER_URL%/}/quota-status?courseId=ci")
          echo "GET /quota-status sem token: HTTP $status"
          [ "$status" = "401" ]

  # Smoke pós-deploy (etapa 6 do plano_testes_e2e.md): abre o site no ar como
  # visitante e confere que a página inicial e o catálogo funcionam, sem erro
  # de JavaScript. Só leitura, sem login e sem segredo nenhum.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke contra a produção
        run: npm run test:smoke

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
